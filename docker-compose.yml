services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: popforms
      POSTGRES_USER: popforms
      POSTGRES_PASSWORD: popforms
    ports:
      - "5433:5432"
    volumes:
      - popforms_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popforms -d popforms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://popforms:popforms@db:5432/popforms?schema=public
      JWT_SECRET: change_me
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: supersecurepassword
      ADMIN_USERNAME: admin
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://192.168.8.10:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  popforms_db: