name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Pull latest code
        run: |
          cd /opt/apps/popForms
          git pull origin main

      - name: Rebuild Containers
        run: |
          cd /opt/apps/popForms
          docker compose up -d --build